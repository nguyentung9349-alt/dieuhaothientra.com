<script>
        (function() {
            const galleries = {
                lucvi: [
                    { src: '3.jpg', label: 'Set 5 gói ngủ ngon', price: '49.000đ' },
                    { src: '4.jpg', label: 'Túi 15 gói', price: '159.000đ' },
                    { src: '5.jpg', label: 'Set 3 túi', price: '389.000đ' },
                    { src: '6.jpg', label: 'Set 4 túi', price: '529.000đ' }
                ],
                thientra: [
                    { src: '7.jpg', label: 'Set 5 gói ngủ ngon', price: '59.000đ' },
                    { src: '8.jpg', label: 'Set 15 gói', price: '229.000đ' },
                    { src: '9.jpg', label: 'Set 3 gói', price: '549.000đ' },
                    { src: '4.jpg', label: 'Set 4 gói', price: '749.000đ' }
                ],
                tuithom: [
                    { src: '14.jpg', label: '01 Túi thơm', price: '79.000đ' },
                    { src: '15.jpg', label: 'Combo 2 túi thơm', price: 'Liên hệ / Cập nhật giá' },
                    { src: '16.jpg', label: 'Combo 3 túi thơm', price: 'Liên hệ / Cập nhật giá' },
                    { src: '17.jpg', label: 'Set quà túi thơm', price: 'Liên hệ / Cập nhật giá' }
                ],
                nenthom: [
                    { src: '18.jpg', label: 'Nến thơm - Phân loại 1', price: 'Liên hệ / Cập nhật giá' },
                    { src: '19.jpg', label: 'Nến thơm - Phân loại 2', price: 'Liên hệ / Cập nhật giá' },
                    { src: '20.jpg', label: 'Nến thơm - Phân loại 3', price: 'Liên hệ / Cập nhật giá' },
                    { src: '21.jpg', label: 'Nến thơm - Phân loại 4', price: 'Liên hệ / Cập nhật giá' }
                ]
            };

            const shopeeLinks = {
                lucvi: 'https://shopee.vn/Tr%C3%A0-L%E1%BB%A5c-V%E1%BB%8B-D%C6%B0%E1%BB%A1ng-Nhan-d%C6%B0%E1%BB%A1ng-da-b%E1%BB%95-huy%E1%BA%BFt-n%E1%BB%99i-ti%E1%BA%BFt-(%C4%90%C3%B4ng-tr%C3%B9ng-h%E1%BA%A3o-t%C3%A1o-%C4%91%E1%BB%8F-k%E1%BB%B3-t%E1%BB%AD-hoa-nh%C3%A0i-hoa-c%C3%BAc-v%C3%A0ng-c%E1%BB%8F-ng%E1%BB%8Dt)-i.121955163.45153381029?extraParams=%7B%22display_model_id%22%3A380323199264%2C%22model_selection_logic%22%3A3%7D&image_ids=vn-11134207-81ztc-mpubje6dr8ct96',
                thientra: 'https://shopee.vn',
                tuithom: 'https://shopee.vn',
                nenthom: 'https://shopee.vn'
            };

            const productNames = {
                lucvi: 'Diệu Hảo Thiền Trà Lục Vị',
                thientra: 'Diệu Hảo Thiền Trà',
                tuithom: 'Túi Thơm Thảo Mộc',
                nenthom: 'Nến Thơm Thảo Mộc'
            };

            document.querySelectorAll('.slider').forEach(function(slider) {
                const key = slider.getAttribute('data-product');
                const slideImgs = slider.querySelectorAll('.slide-img');
                if (!slideImgs.length) return;

                let currentIdx = 0;
                const counterEl = slider.querySelector('.img-counter');
                const dots = slider.querySelectorAll('.dot');
                const prevBtn = slider.querySelector('.prev');
                const nextBtn = slider.querySelector('.next');
                const thumbs = document.querySelectorAll('[data-thumbs="' + key + '"] .thumb-btn');

                function showImage(newIdx) {
                    currentIdx = (newIdx + slideImgs.length) % slideImgs.length;
                    slideImgs.forEach(function(img, i) {
                        img.style.display = (i === currentIdx) ? 'block' : 'none';
                    });
                    if (counterEl) {
                        counterEl.textContent = (currentIdx + 1) + ' / ' + slideImgs.length;
                    }
                    dots.forEach(function(dot, i) {
                        dot.classList.toggle('active', i === currentIdx);
                    });
                    thumbs.forEach(function(thumb, i) {
                        thumb.classList.toggle('active', i === currentIdx);
                    });
                }

                prevBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    showImage(currentIdx - 1);
                });

                nextBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    showImage(currentIdx + 1);
                });

                dots.forEach(function(dot) {
                    dot.addEventListener('click', function(e) {
                        e.preventDefault();
                        e.stopPropagation();
                        const idx = parseInt(dot.getAttribute('data-idx'), 10);
                        if (!isNaN(idx)) showImage(idx);
                    });
                });

                thumbs.forEach(function(thumb) {
                    thumb.addEventListener('click', function(e) {
                        e.preventDefault();
                        const idx = parseInt(thumb.getAttribute('data-idx'), 10);
                        if (!isNaN(idx)) showImage(idx);
                    });
                });
            });

            const modal = document.getElementById('productModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalImg = document.getElementById('modalImg');
            const modalVariants = document.getElementById('modalVariants');
            const modalPrice = document.getElementById('modalPrice');
            const modalShopee = document.getElementById('modalShopee');

            function openModal(key) {
                const items = galleries[key];
                if (!items) return;
                modalTitle.textContent = productNames[key] || '';
                modalShopee.href = shopeeLinks[key] || 'https://shopee.vn';
                modalVariants.innerHTML = '';

                items.forEach(function(item, idx) {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'var-btn' + (idx === 0 ? ' active' : '');
                    btn.textContent = item.label;
                    btn.addEventListener('click', function() {
                        modalVariants.querySelectorAll('.var-btn').forEach(function(b) {
                            b.classList.remove('active');
                        });
                        btn.classList.add('active');
                        modalImg.src = item.src;
                        if (modalPrice) {
                            modalPrice.textContent = item.price || 'Liên hệ / Cập nhật giá';
                        }
                    });
                    modalVariants.appendChild(btn);
                });

                modalImg.src = items[0].src;
                if (modalPrice) {
                    modalPrice.textContent = items[0].price || 'Liên hệ / Cập nhật giá';
                }
                modal.classList.add('open');
            }

            function closeModal() {
                modal.classList.remove('open');
            }

            document.querySelectorAll('[data-open-modal]').forEach(function(el) {
                el.addEventListener('click', function() {
                    openModal(el.getAttribute('data-open-modal'));
                });
            });

            document.getElementById('closeModalBtn').addEventListener('click', closeModal);
            document.getElementById('modalContactBtn').addEventListener('click', closeModal);
            modal.addEventListener('click', function(e) {
                if (e.target === modal) closeModal();
            });
        })();
    </script>
